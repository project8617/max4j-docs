apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: max4j-docs-root
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: max4j.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: max4j-docs
                port:
                  name: http
